<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../Styles/Login_Page.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gwendolyn:wght@400;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="../Scripts/jquery-3.7.1.js"></script>
  </head>
  <body>
    <main>
        <div class="brand">
            <p><a href="./home.html">DHX</a></p>
        </div>
        <div class="title">
            <h1>Exam System</h1>
            <p>Welcome Back! Please enter your details.</p>
        </div>
        <section class="dataEntry">
            <ul class="userType">
                <li id="StudentTab">Student</li>
                <li id="teacherTab">Teacher</li>
            </ul>
            <div class="StudentLogin">
                <form action="#" method="get">
                    <div class="userInputName">
                        <label for="userID">User Name / Email Address</label>
                        <div class="containerForIcon">
                            <span><i class="fa-regular fa-envelope"></i></span>
                            <input type="text" name="userID" id="userID" autocomplete="username" placeholder="What is your username or email?">
                        </div>
                    </div>
                    <div class="userPassword">
                        <label for="userPassword">Password</label>
                        <div class="containerForIcon">
                            <span><i class="fa-solid fa-lock"></i></span>
                            <input type="password" name="userPassword" autocomplete="current-password" id="userPassword" placeholder="What is your password?">
                        </div>
                        <a href="#">Forgot Password?</a>
                    </div>
                    <div class="remember">
                        <input type="checkbox" name="rememberMe" id="rememberMe">
                        <label for="rememberMe">Remember me for 30 days</label>
                    </div>
                    <button>Sign in</button>
                    <button class="goToStudent">Student</button>
                    <button class="goToTeacher">Teacher</button>
                </form>
            </div>
            <div class="TeacherLogin">
                <form action="#" method="get">
                    <div class="userInputName">
                        <label for="userID">User Name / Email Address</label>
                        <div class="containerForIcon">
                            <span><i class="fa-regular fa-envelope"></i></span>
                            <input type="text" name="userID" id="userID" autocomplete="username" placeholder="What is your username or email?">
                        </div>
                    </div>
                    <div class="userPassword">
                        <label for="userPassword">Password</label>
                        <div class="containerForIcon">
                            <span><i class="fa-solid fa-lock"></i></span>
                            <input type="password" name="userPassword" autocomplete="current-password" id="userPassword" placeholder="What is your password?">
                        </div>
                        <a href="#">Forgot Password?</a>
                    </div>
                    <div class="userSpecialKey">
                        <label for="userSpecialKey">Special Key</label>
                        <div class="containerForIcon">
                            <span><i class="fa-solid fa-key"></i></span>
                            <input type="password" name="userSpecialKey" id="userSpecialKey" autocomplete="new-password" placeholder="What is your Special Key?">
                        </div>
                        <a href="#">Forgot your Special Key?</a>
                    </div>
                    <div class="remember">
                        <input type="checkbox" name="rememberMe" id="rememberMe">
                        <label for="rememberMe">Remember me for 30 days</label>
                    </div>
                    <button>Sign in</button>
                    <button class="goToStudent">Student</button>
                    <button class="goToTeacher">Teacher</button>
                </form>
            </div>
            <p>Don't have an account? <a href="./Registration_Page.html">Sign up for free</a></p>
        </section>
    </main>
    <footer>
        <p><span></span> System Status</p>
        <a href="">Help Center</a>
        <a href="">Privacy Policy</a>
    </footer>
    <script src="../Scripts/showTabs.js"></script>
    <script src="../Scripts/Login_Page.js"></script>
  </body>
</html>
